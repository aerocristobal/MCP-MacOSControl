# STORY-021 — Software Supply Chain Security
#
# Swift packages move slowly; weekly cadence creates churn without payoff.
# GitHub Actions ship security fixes more often, so weekly there. Reviewers
# and labels feed the security-review workflow described in docs/SECURITY.md §8.
version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security-review"
    reviewers:
      - "aerocristobal"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
