name: CI Integration (STORY-012)

# End-to-End Integration Validation Suite. NOT run per-PR: macOS runners are
# ~10× Linux cost and the suite needs a logged-in GUI session + Accessibility
# permission, which is flaky on shared per-PR runners. Unit tests catch ≥95% of
# regressions on every PR (ci.yml); this is the safety net on merge + nightly.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"   # nightly 07:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ci-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: macos-15
    # §6 DoD: 15-minute hard cap. A hung wait or runaway loop must fail CI
    # rather than block it.
    timeout-minutes: 15
    permissions:
      # STORY-037 — nightly OSCAL observation append needs to push the
      # updated assessment-results.json back to the branch. The push only
      # runs on `schedule` / `workflow_dispatch` events; per-push runs of
      # this workflow do not touch the file.
      contents: write
      actions: read
      checks: write
    env:
      CI_MACOS_INTEGRATION: "true"
      # STORY-020 — write directly to the canonical committed file so the post-
      # test diff gate (below) can detect new observations against the
      # repository's last-committed state. Pre-STORY-020 this pointed at an
      # ephemeral artifact path; the diff gate replaces that workflow.
      STORY_012_OBSERVATIONS_JSON: ${{ github.workspace }}/docs/compatibility-observations.json
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-integration-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-integration-
            ${{ runner.os }}-swift-

      # Provision Accessibility for the test runner. See
      # docs/INTEGRATION-CI-SETUP.md for the full rationale and the
      # signed-helper path required on macOS 13+ (TCC cannot be granted by a
      # bare `tccutil` on modern macOS — the reset gives a clean slate and the
      # provisioned image / signed helper supplies the grant).
      - name: Reset Accessibility TCC (clean slate)
        run: sudo tccutil reset Accessibility || true

      - name: Provision Accessibility grant
        run: |
          if [ -x /usr/local/bin/mcp-tcc-grant ]; then
            sudo /usr/local/bin/mcp-tcc-grant Accessibility
          else
            echo "::warning::No signed TCC grant helper on this runner; \
            permission-dependent scenarios will skip with a structured reason. \
            See docs/INTEGRATION-CI-SETUP.md."
          fi

      - name: Build (tests)
        run: swift build --build-tests

      - name: Run integration suite
        run: swift test --filter MCP_MacOSControlIntegrationTests

      - name: Upload interaction-method observations (STORY-020 feed)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: story-012-interaction-observations
          path: ${{ env.STORY_012_OBSERVATIONS_JSON }}
          if-no-files-found: ignore

      # STORY-020 — regenerate the published catalog from the (now updated)
      # observations file. Persistent registry-vs-reality discrepancies (≥ 3
      # consecutive runs) fail this step via the CLI's exit code; single-run
      # mismatches print a warning but pass. Always runs so a failed integration
      # run still gives operators the regenerated diff to inspect.
      - name: Regenerate APP-COMPATIBILITY.md (STORY-020)
        if: always()
        run: |
          swift run mcp-macos-control-catalog \
            --observations docs/compatibility-observations.json \
            --registry Sources/MacOSControlLib/Router/Defaults/default-app-capabilities.json \
            --output docs/APP-COMPATIBILITY.md

      # STORY-020 — fail the job if the integration run produced observations
      # that have not been committed, or if the regenerated catalog Markdown
      # differs from the committed version. The maintainer's job is to commit
      # the diff (auto-PR is deferred to a follow-on story).
      - name: Verify catalog & observations are committed
        if: always()
        run: |
          if ! git diff --exit-code -- docs/APP-COMPATIBILITY.md docs/compatibility-observations.json; then
            echo "::error::Integration run produced uncommitted catalog changes. \
            Run \`swift run mcp-macos-control-catalog --observations docs/compatibility-observations.json \
            --registry Sources/MacOSControlLib/Router/Defaults/default-app-capabilities.json \
            --output docs/APP-COMPATIBILITY.md\` locally, commit the diff, and re-push."
            exit 1
          fi

      - name: Upload regenerated catalog (when diff gate fails)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-compatibility-regenerated
          path: |
            docs/APP-COMPATIBILITY.md
            docs/compatibility-observations.json
          if-no-files-found: ignore

      # STORY-037 — Nightly OSCAL observation emission.
      #
      # The integration suite exercises the AppleScript and menu-click
      # tools end-to-end, which means it writes AuditRecord lines to the
      # STORY-024 log directory under the runner's
      # ~/Library/Logs/com.mcp.macos-control/audit/ path. Append those
      # records to the committed Assessment Results file and, if it
      # changed, commit and push the diff. If the integration run produced
      # no audit records (e.g. the suite skipped entirely), append from
      # the committed fixture so the AR's last-modified timestamp still
      # advances and the pipeline is verifiably alive.
      #
      # The 90-day retention window (STORY-037 Q1) is applied here so the
      # AR doesn't grow unbounded.
      - name: Emit OSCAL observations from integration audit log (STORY-037)
        if: always()
        run: |
          set -euo pipefail
          INPUT="${RUNNER_TEMP:-/tmp}/oscal-emit-input.jsonl"
          : > "${INPUT}"
          AUDIT_DIR="${HOME}/Library/Logs/com.mcp.macos-control/audit"
          if [ -d "${AUDIT_DIR}" ]; then
            # Concatenate today's and yesterday's audit lines into the input.
            for FN in "audit-$(date -u +%Y-%m-%d).jsonl" "audit-$(date -u -v-1d +%Y-%m-%d 2>/dev/null || date -u -d '-1 day' +%Y-%m-%d).jsonl"; do
              if [ -f "${AUDIT_DIR}/${FN}" ]; then
                cat "${AUDIT_DIR}/${FN}" >> "${INPUT}"
              fi
            done
          fi
          if [ ! -s "${INPUT}" ]; then
            echo "::warning::No audit records found at ${AUDIT_DIR}; emitting from the committed fixture so the pipeline stays alive."
            cp Tests/MCP-MacOSControlTests/Compliance/Fixtures/audit-records-sample.jsonl "${INPUT}"
          fi
          swift run oscal-emit \
            --retention-days 90 \
            --poam oscal/plan-of-action-and-milestones.json \
            "${INPUT}" \
            oscal/assessment-results.json

      - name: Commit nightly OSCAL observations (STORY-037)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if git diff --quiet oscal/assessment-results.json oscal/plan-of-action-and-milestones.json; then
            echo "No new observations or POA&M cross-links to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oscal/assessment-results.json oscal/plan-of-action-and-milestones.json
          git commit -m "chore(oscal): nightly observations append (STORY-037)"
          # Push back to the same ref the workflow is running against.
          git push origin HEAD:"${GITHUB_REF_NAME}"
